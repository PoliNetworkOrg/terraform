      repoURL: https://github.com/poliNetworkOrg/polinetwork-cd
      targetRevision: HEAD
      path: app-dev
      directory:
        recurse: true
    destination:
      server: https://kubernetes.default.svc
      namespace: app-dev
    syncPolicy:
      automated:
        prune: true
        selfHeal: true
      syncOptions:
        - CreateNamespace=false
    info:
      - name: url
        value: https://argoproj.github.io/
  - name: aule-bot
    namespace: argocd
    project: default
    source:
      repoURL: https://github.com/poliNetworkOrg/polinetwork-cd
      targetRevision: HEAD
      path: bot-rooms
      directory:
        recurse: true
    destination:
      server: https://kubernetes.default.svc
      namespace: aulebot
    syncPolicy:
      automated:
        prune: true
        selfHeal: true
      syncOptions:
        - CreateNamespace=false
    info:
      - name: url
        value: https://argoproj.github.io/
  - name: cloudflared
    namespace: argocd
    project: default
    source:
      repoURL: "https://cloudflare.github.io/helm-charts"
      chart: cloudflare-tunnel-remote
      targetRevision: 0.1.2
    destination:
      namespace: cloudflared
      server: "https://kubernetes.default.svc"
    syncPolicy:
      automated:
        prune: true
        selfHeal: true
      syncOptions:
        - CreateNamespace=false
