  - name: bot-prod
    namespace: argocd
    project: default
    source:
      repoURL: https://github.com/poliNetworkOrg/polinetwork-cd
      targetRevision: HEAD
      path: bot-prod
      directory:
        recurse: true
    destination:
      server: https://kubernetes.default.svc
      namespace: bot-prod
    syncPolicy:
      automated:
        prune: true
        selfHeal: true
      syncOptions:
        - CreateNamespace=false
    info:
      - name: url
        value: https://argoproj.github.io/
  - name: bot-mat
    namespace: argocd
    project: default
    source:
      repoURL: https://github.com/poliNetworkOrg/polinetwork-cd
      targetRevision: HEAD
      path: bot-mat
      directory:
        recurse: true
    destination:
      server: https://kubernetes.default.svc
      namespace: bot-mat
    syncPolicy:
      automated:
        prune: true
        selfHeal: true
      syncOptions:
        - CreateNamespace=false
        - Replace=true
    info:
      - name: url
        value: https://argoproj.github.io/
  - name: mariadb
    namespace: argocd
    project: default
