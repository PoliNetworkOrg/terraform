      path: mariadb
      directory:
        recurse: true
    destination:
      server: https://kubernetes.default.svc
      namespace: mariadb
    syncPolicy:
      automated:
        prune: true
        selfHeal: true
      syncOptions:
        - CreateNamespace=false
    info:
      - name: url
        value: https://argoproj.github.io/
  - name: app-dev
    namespace: argocd
    project: default
