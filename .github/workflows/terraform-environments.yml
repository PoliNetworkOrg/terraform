name: Terraform

on:
  push:
    branches:
      - stable
  pull_request:

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_USE_AZUREAD: "true"
  ARM_USE_OIDC: "true"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  terraform:
    name: Terraform (${{ matrix.environment }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        environment:
          - legacy
          - k3s
    defaults:
      run:
        working-directory: environments/${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in with Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup .kube
        if: matrix.environment == 'legacy'
        run: az aks get-credentials --resource-group rg-polinetwork --name aks-polinetwork --admin --overwrite-existing || true

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt
        id: fmt
        run: terraform fmt -check
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color
        continue-on-error: true

      - name: Publish Terraform result to the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          ENVIRONMENT: ${{ matrix.environment }}
          FMT_OUTCOME: ${{ steps.fmt.outcome }}
          INIT_OUTCOME: ${{ steps.init.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          VALIDATION: ${{ steps.validate.outputs.stdout }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          PLAN: ${{ steps.plan.outputs.stdout }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const environment = process.env.ENVIRONMENT;
            const marker = `<!-- terraform-plan:${environment} -->`;
            const truncate = (text, limit) => {
              if (text.length <= limit) return text;
              return `${text.slice(0, limit)}\n\n... output truncated; see the workflow log for the complete output.`;
            };
            const validation = truncate(process.env.VALIDATION || '', 8_000);
            const plan = truncate(process.env.PLAN || '', 45_000);
            const body = `${marker}
            ## Terraform (${environment})

            #### Format and style: \`${process.env.FMT_OUTCOME}\`
            #### Initialization: \`${process.env.INIT_OUTCOME}\`
            #### Validation: \`${process.env.VALIDATE_OUTCOME}\`

            <details><summary>Validation output</summary>

            \`\`\`
            ${validation}
            \`\`\`

            </details>

            #### Plan: \`${process.env.PLAN_OUTCOME}\`

            <details><summary>Show plan</summary>

            \`\`\`terraform
            ${plan}
            \`\`\`

            </details>

            *Pusher: @${context.actor}, Action: \`${context.eventName}\`, Working directory: \`environments/${environment}\`, Workflow: \`${context.workflow}\`*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const previous = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body.includes(marker)
            );

            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

  apply:
    name: Terraform Apply
    if: github.event_name == 'push' && github.ref == 'refs/heads/stable'
    runs-on: ubuntu-22.04
    needs: terraform
    environment: production
    concurrency: terraform-production
    steps:
      - uses: actions/checkout@v4

      - name: Log in with Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init (k3s)
        working-directory: environments/k3s
        run: terraform init

      - name: Terraform Apply (k3s)
        working-directory: environments/k3s
        run: terraform apply -auto-approve -input=false

      - name: Setup .kube
        run: az aks get-credentials --resource-group rg-polinetwork --name aks-polinetwork --admin --overwrite-existing || true

      - name: Terraform Init (legacy)
        working-directory: environments/legacy
        run: terraform init

      - name: Terraform Apply (legacy)
        working-directory: environments/legacy
        run: terraform apply -auto-approve -input=false
