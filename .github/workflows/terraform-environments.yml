name: Terraform

on:
  pull_request:
    branches: [stable]
  push:
    branches: [stable]
  workflow_dispatch:
    inputs:
      environment:
        description: Root Terraform to apply
        required: true
        type: choice
        options:
          - legacy
          - k3s
      confirmation:
        description: Type APPLY to create and apply a fresh reviewed plan
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_USE_AZUREAD: "true"
  ARM_USE_OIDC: "true"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  validate:
    if: github.event_name != 'workflow_dispatch'
    name: Validate (${{ matrix.environment }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        environment: [legacy, k3s]
    defaults:
      run:
        working-directory: environments/${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Check formatting
        run: terraform fmt -check -recursive ../..
      - name: Initialize without remote state
        run: terraform init -backend=false
      - name: Validate configuration
        run: terraform validate -no-color

  plan:
    if: github.event_name != 'workflow_dispatch'
    name: Plan (${{ matrix.environment }})
    runs-on: ubuntu-24.04
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        environment: [legacy, k3s]
    defaults:
      run:
        working-directory: environments/${{ matrix.environment }}
    env:
      # A real operator key is required only when applying. This syntactically
      # valid public key lets PR plans evaluate the VM schema without exposing
      # or persisting a personal key.
      TF_VAR_admin_ssh_public_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILQjBf4Q5OCGhvRHV2HBXI2Td1TmGTHoKZBSwQ+bhagJ terraform-plan-only
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Load AKS credentials for the legacy providers
        if: matrix.environment == 'legacy'
        run: az aks get-credentials --resource-group rg-polinetwork --name aks-polinetwork --admin --overwrite-existing
      - name: Initialize remote state
        run: terraform init
      - name: Create plan
        run: terraform plan -lock=false -no-color -out=tfplan
      - name: Add plan to job summary
        run: |
          echo "## ${{ matrix.environment }}" >> "$GITHUB_STEP_SUMMARY"
          terraform show -json tfplan \
            | jq -r '.resource_changes[] | select(.change.actions != ["no-op"] and .change.actions != ["read"]) | "- `\(.change.actions | join(","))` `\(.address)`"' \
            >> "$GITHUB_STEP_SUMMARY"

  apply:
    if: github.event_name == 'workflow_dispatch' && inputs.confirmation == 'APPLY'
    name: Apply (${{ inputs.environment }})
    runs-on: ubuntu-24.04
    environment: production
    concurrency: terraform-${{ inputs.environment }}-production
    defaults:
      run:
        working-directory: environments/${{ inputs.environment }}
    env:
      TF_VAR_admin_ssh_public_key: ${{ secrets.K3S_ADMIN_SSH_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Load AKS credentials for the legacy providers
        if: inputs.environment == 'legacy'
        run: az aks get-credentials --resource-group rg-polinetwork --name aks-polinetwork --admin --overwrite-existing
      - name: Require the K3s administrator key
        if: inputs.environment == 'k3s'
        run: test -n "$TF_VAR_admin_ssh_public_key"
      - name: Initialize remote state
        run: terraform init
      - name: Create fresh plan
        run: terraform plan -out=tfplan
      - name: Apply the saved plan
        run: terraform apply -auto-approve tfplan
