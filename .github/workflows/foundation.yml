name: Terraform ARM64 Foundation

on:
  pull_request:
    branches: [stable]
    paths:
      - "foundation/**"
      - ".github/workflows/foundation.yml"
  push:
    branches: [stable]
    paths:
      - "foundation/**"
      - ".github/workflows/foundation.yml"
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the reviewed foundation plan"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    working-directory: foundation

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - name: Initialize without remote state
        run: terraform init -backend=false
      - name: Check formatting
        run: terraform fmt -check -recursive
      - name: Validate configuration
        run: terraform validate
      - name: Validate disk preparation script
        run: bash -n scripts/prepare-data-disks.sh

  plan:
    name: Plan
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - name: Initialize remote state
        run: terraform init
      - name: Create plan
        run: terraform plan -out=foundation.tfplan
      - uses: actions/upload-artifact@v4
        with:
          name: arm64-foundation-plan
          path: foundation/foundation.tfplan
          retention-days: 1

  apply:
    name: Apply
    if: github.event_name == 'workflow_dispatch' && inputs.apply && github.ref == 'refs/heads/stable'
    needs: plan
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - name: Initialize remote state
        run: terraform init
      - uses: actions/download-artifact@v4
        with:
          name: arm64-foundation-plan
          path: foundation
      - name: Apply reviewed plan
        run: terraform apply -auto-approve foundation.tfplan
