name: Terraform ARM64 Foundation

on:
  pull_request:
    branches: [stable]
    paths:
      - "foundation/**"
      - ".github/workflows/foundation.yml"
  push:
    branches: [stable]
    paths:
      - "foundation/**"
      - ".github/workflows/foundation.yml"
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the reviewed foundation plan"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    working-directory: foundation

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - name: Initialize without remote state
        run: terraform init -backend=false
      - name: Check formatting
        run: terraform fmt -check -recursive
      - name: Validate configuration
        run: terraform validate
      - name: Validate disk preparation script
        run: bash -n scripts/prepare-data-disks.sh

  plan:
    name: Plan
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - name: Initialize remote state
        run: terraform init
      - name: Create plan
        run: terraform plan -out=foundation.tfplan
      - name: Render plan
        run: |
          terraform show -no-color foundation.tfplan > foundation-plan.txt
          {
            echo "## ARM64 foundation Terraform plan"
            echo '```terraform'
            cat foundation-plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: arm64-foundation-plan
          path: |
            foundation/foundation.tfplan
            foundation/foundation-plan.txt
          retention-days: 1
      - name: Publish foundation plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- arm64-foundation-terraform-plan -->';
            const plan = fs.readFileSync('foundation/foundation-plan.txt', 'utf8');
            const maxPlanLength = 60000;
            const renderedPlan = plan.length > maxPlanLength
              ? `${plan.slice(0, maxPlanLength)}\n\n... output truncated; download the CI artifact for the complete plan.`
              : plan;
            const body = `${marker}\n## ARM64 foundation Terraform plan\n\n<details><summary>Click to expand</summary>\n\n\`\`\`terraform\n${renderedPlan}\n\`\`\`\n</details>`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(comment => comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  apply:
    name: Apply
    if: github.event_name == 'workflow_dispatch' && inputs.apply && github.ref == 'refs/heads/stable'
    needs: plan
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - name: Initialize remote state
        run: terraform init
      - uses: actions/download-artifact@v4
        with:
          name: arm64-foundation-plan
          path: foundation
      - name: Apply reviewed plan
        run: terraform apply -auto-approve foundation.tfplan
